# Cloudflare Worker with static assets.
#
# This project is a WORKER, not a Pages project (Workers & Pages →
# sigrun-website → Production). That is why the dashboard has no "Build
# output directory" field: a Worker's build settings are only Build command,
# Deploy command, Root directory and Build variables. The assets directory
# below IS the output directory, and this file is its only source of truth.
#
# `name` must equal the Worker name. A mismatch produces "Update
# wrangler.toml in your repo to keep settings consistent" — the warning is
# literally naming the value it wants.
name = "sigrun-website"
compatibility_date = "2026-10-01"

[assets]
# `npm run build` writes dist/: index.html, styles.css, app.js, themes.css,
# 404.html, favicon.svg.
directory = "./dist"
# Serve dist/404.html with a real 404 status for unmatched paths.
not_found_handling = "404-page"
